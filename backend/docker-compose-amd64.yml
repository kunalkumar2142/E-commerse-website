# Dev/debug compose: exposes all service and DB ports, builds for linux/amd64.
# Uses the same .env as docker-compose.yml.

services:
  shopre-service-discovery:
    build:
      context: ./service-discovery
    image: kunal2142/service-discovery
    platform: linux/amd64
    container_name: shopre-service-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - shopre-network

  shopre-product-service:
    build:
      context: ./product
    image: kunal2142/shopre-product-service
    platform: linux/amd64
    container_name: shopre-product-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://shopre-product-db:5432/shopre-product-db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://shopre-service-discovery:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      shopre-product-db:
        condition: service_healthy
      shopre-service-discovery:
        condition: service_healthy
    networks:
      - shopre-network

  shopre-product-db:
    image: postgres:16-alpine
    container_name: shopre-product-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: shopre-product-db
    ports:
      - "5440:5432"
    volumes:
      - shopre-product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shopre-network

  shopre-user-authentication-service:
    build:
      context: ./user-authentication
    image: kunal2142/shopre-user-authentication-service
    platform: linux/amd64
    container_name: shopre-user-authentication-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://shopre-users-db:5432/shopre-users-db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://shopre-service-discovery:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      shopre-users-db:
        condition: service_healthy
      shopre-service-discovery:
        condition: service_healthy
    networks:
      - shopre-network

  shopre-users-db:
    image: postgres:16-alpine
    container_name: shopre-users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: shopre-users-db
    ports:
      - "5441:5432"
    volumes:
      - shopre-users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shopre-network

  shopre-order-cart-service:
    build:
      context: ./order-and-cart-management
    image: kunal2142/shopre-order-and-cart-management-service
    platform: linux/amd64
    container_name: shopre-order-cart-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://shopre-cart-db:5432/shopre-cart-db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://shopre-service-discovery:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      shopre-cart-db:
        condition: service_healthy
      shopre-service-discovery:
        condition: service_healthy
      shopre-product-service:
        condition: service_started
    networks:
      - shopre-network

  shopre-cart-db:
    image: postgres:16-alpine
    container_name: shopre-cart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: shopre-cart-db
    ports:
      - "5442:5432"
    volumes:
      - shopre-cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shopre-network

  shopre-api-gateway:
    build:
      context: ./shopre-api-gateway
    image: kunal2142/shopre-api-gateway
    platform: linux/amd64
    container_name: shopre-api-gateway
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://shopre-service-discovery:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET:?set JWT_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      shopre-service-discovery:
        condition: service_healthy
      shopre-product-service:
        condition: service_started
      shopre-user-authentication-service:
        condition: service_started
      shopre-order-cart-service:
        condition: service_started
    networks:
      - shopre-network

volumes:
  shopre-product-db-data:
  shopre-users-db-data:
  shopre-cart-db-data:

networks:
  shopre-network:
    driver: bridge
